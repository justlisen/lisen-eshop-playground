services:
  postgres:
    image: postgres:16-alpine
    container_name: eshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eshop
      POSTGRES_PASSWORD: eshop_dev_password
      POSTGRES_DB: eshop_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
